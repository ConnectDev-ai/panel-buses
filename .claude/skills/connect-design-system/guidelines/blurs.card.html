<!-- @dsCard group="Effects" viewport="700x190" name="Blurs" subtitle="Light and dark glass panels over imagery" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--neutral-50);padding:16px;box-sizing:border-box;font-family:var(--font-primary)}</style></head><body><div style="height:158px;border-radius:12px;background:url(../assets/images/blur-sample.png) center/cover;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;box-sizing:border-box"><div style="border-radius:12px;background:var(--glass-light);backdrop-filter:var(--blur-sm);-webkit-backdrop-filter:var(--blur-sm);box-shadow:var(--glass-light-hairline);display:flex;align-items:center;justify-content:center;font-family:var(--font-ui);font-weight:500;font-size:20px;color:#171717">sm light</div><div style="border-radius:12px;background:var(--glass-dark);backdrop-filter:var(--blur-sm);-webkit-backdrop-filter:var(--blur-sm);box-shadow:var(--glass-light-hairline);display:flex;align-items:center;justify-content:center;font-family:var(--font-ui);font-weight:500;font-size:20px;color:#fff">sm dark</div><div style="border-radius:12px;background:var(--glass-light);backdrop-filter:var(--blur-xl);-webkit-backdrop-filter:var(--blur-xl);box-shadow:var(--glass-light-hairline);display:flex;align-items:center;justify-content:center;font-family:var(--font-ui);font-weight:500;font-size:20px;color:#171717">xl light</div><div style="border-radius:12px;background:var(--glass-dark);backdrop-filter:var(--blur-xl);-webkit-backdrop-filter:var(--blur-xl);box-shadow:var(--glass-light-hairline);display:flex;align-items:center;justify-content:center;font-family:var(--font-ui);font-weight:500;font-size:20px;color:#fff">xl dark</div></div></body></html>
