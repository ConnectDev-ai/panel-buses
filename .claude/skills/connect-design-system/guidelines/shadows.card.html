<!-- @dsCard group="Effects" viewport="700x150" name="Drop shadows" subtitle="Five elevation steps on the 12px card" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--neutral-50);padding:16px;box-sizing:border-box;font-family:var(--font-primary)}</style></head><body><div style="display:flex;gap:16px;padding:12px 4px"><div style="flex:1"><div style="height:70px;border-radius:12px;background:var(--surface-card);box-shadow:var(--shadow-card-border),var(--shadow-xs)"></div><div style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;color:var(--text-secondary);margin-top:9px;text-transform:uppercase">shadow-xs</div></div><div style="flex:1"><div style="height:70px;border-radius:12px;background:var(--surface-card);box-shadow:var(--shadow-card-border),var(--shadow-sm)"></div><div style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;color:var(--text-secondary);margin-top:9px;text-transform:uppercase">shadow-sm</div></div><div style="flex:1"><div style="height:70px;border-radius:12px;background:var(--surface-card);box-shadow:var(--shadow-card-border),var(--shadow-md)"></div><div style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;color:var(--text-secondary);margin-top:9px;text-transform:uppercase">shadow-md</div></div><div style="flex:1"><div style="height:70px;border-radius:12px;background:var(--surface-card);box-shadow:var(--shadow-card-border),var(--shadow-lg)"></div><div style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;color:var(--text-secondary);margin-top:9px;text-transform:uppercase">shadow-lg</div></div><div style="flex:1"><div style="height:70px;border-radius:12px;background:var(--surface-card);box-shadow:var(--shadow-card-border),var(--shadow-xl)"></div><div style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;color:var(--text-secondary);margin-top:9px;text-transform:uppercase">shadow-xl</div></div></div></body></html>
