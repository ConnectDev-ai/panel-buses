<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--neutral-50);padding:16px;box-sizing:border-box;font-family:var(--font-primary)}</style></head><body><div style="display:flex;gap:14px"><div style="flex:1"><div style="height:58px;border-radius:4px;background:var(--neutral-100);box-shadow:inset 0 0 0 1px var(--border-strong)"></div><div style="font-size:11px;font-weight:600;color:var(--text-title);margin-top:6px">xs · 4px</div><div style="font-size:10px;color:var(--text-secondary)">status chips</div></div><div style="flex:1"><div style="height:58px;border-radius:8px;background:var(--neutral-100);box-shadow:inset 0 0 0 1px var(--border-strong)"></div><div style="font-size:11px;font-weight:600;color:var(--text-title);margin-top:6px">sm · 8px</div><div style="font-size:10px;color:var(--text-secondary)">buttons, swatches</div></div><div style="flex:1"><div style="height:58px;border-radius:12px;background:var(--neutral-100);box-shadow:inset 0 0 0 1px var(--border-strong)"></div><div style="font-size:11px;font-weight:600;color:var(--text-title);margin-top:6px">md · 12px</div><div style="font-size:10px;color:var(--text-secondary)">cards, glass</div></div><div style="flex:1"><div style="height:58px;border-radius:16px;background:var(--neutral-100);box-shadow:inset 0 0 0 1px var(--border-strong)"></div><div style="font-size:11px;font-weight:600;color:var(--text-title);margin-top:6px">lg · 16px</div><div style="font-size:10px;color:var(--text-secondary)">page containers</div></div><div style="flex:1"><div style="height:58px;border-radius:9999px;background:var(--neutral-100);box-shadow:inset 0 0 0 1px var(--border-strong)"></div><div style="font-size:11px;font-weight:600;color:var(--text-title);margin-top:6px">full · 9999px</div><div style="font-size:10px;color:var(--text-secondary)">pills, dots</div></div></div></body></html>
