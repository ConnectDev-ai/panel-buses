<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--neutral-50);padding:16px;box-sizing:border-box;font-family:var(--font-primary)}</style></head><body><div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:10px"><span class="cx-button-large" style="color:var(--text-title)">Button large</span><span style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;color:var(--text-secondary);white-space:nowrap">14PX · 140% · +4% · Bold</span></div><div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:10px"><span class="cx-button-small" style="color:var(--text-title)">Button small</span><span style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;color:var(--text-secondary);white-space:nowrap">12PX · 140% · +6% · semiBold</span></div><div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:10px"><span class="cx-link" style="color:var(--text-title)">Link</span><span style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;color:var(--text-secondary);white-space:nowrap">14PX · 140% · +6% · medium</span></div><div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:10px"><span class="cx-link-small" style="color:var(--text-title)">Link small</span><span style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;color:var(--text-secondary);white-space:nowrap">12PX · 140% · +6% · medium</span></div></body></html>
