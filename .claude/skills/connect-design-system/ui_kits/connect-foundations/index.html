<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Connect — UI Kit</title>
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;background:var(--neutral-50)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.__CONNECT_ASSETS='../../assets/logos'</script>
<script src="../../_ds_bundle.js"></script></head>
<body><div id="root"></div>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="ColorScreens.jsx"></script>
<script type="text/babel" src="SystemScreens.jsx"></script>
<script type="text/babel">
function App() {
  const [page, setPage] = React.useState('basics');
  const [dark, setDark] = React.useState(false);
  return (
    <div>
      <Nav page={page} setPage={setPage} />
      {page === 'basics' && <ColorsBasics />}
      {page === 'palette' && <ColorPalette dark={dark} setDark={setDark} />}
      {page === 'gradient' && <ColorGradient />}
      {page === 'type' && <TypographyScreen />}
      {page === 'spacing' && <SpacingScreen />}
      {page === 'effects' && <EffectsScreen />}
      {page === 'icons' && <IconsScreen />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
